<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backroads">
<meta name="description" content="Finds driving laps worth the fuel.">
<title>Backroads</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./app/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./app/icon-192.png">

<link rel="stylesheet" href="./vendor/fonts.css">
<link rel="stylesheet" href="./vendor/leaflet.css">

<style>
/* ---------- tokens ---------- */
:root{
  --bg:#EDEFEE;
  --surface:#FFFFFF;
  --raised:#F2F4F3;
  --ink:#0E1417;
  --muted:#6C7671;
  --line:#E3E7E5;
  /* Hyundai N Performance Blue (paint code SFB/XFB), sourced from a paint
     retailer's colour-matched swatch, not a guess — it's the actual i30N's
     colour. Lighter than it looks in photos, which is why anything filled
     with it pairs with --on-route rather than white text. */
  --route:#80A3C5;        /* the drawn lap, and the brand colour generally */
  --on-route:#0E1417;     /* text/icons on a --route-filled surface, fixed in both themes */
  --casing:#FFFFFF;       /* drawn under the lap, to lift it off the map */
  --accent:#FF5A1F;       /* where the lap begins, favourites */
  --shadow:0 -14px 44px rgba(14,20,23,.16);
  --r:14px;
  --pill:999px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1113;
    --surface:#171B1E;
    --raised:#21262A;
    --ink:#ECEFEE;
    --muted:#8C958F;
    --line:#282E33;
    /* --route stays the same colour in both themes — it's light enough
       already (unlike the old indigo) to hold up against a dark map too. */
    --casing:#04070A;
    --accent:#FF7A47;
    --shadow:0 -14px 44px rgba(0,0,0,.55);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:Barlow,system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--route);outline-offset:2px;border-radius:6px}

/* ---------- map ---------- */
#map{position:fixed;inset:0;background:var(--bg);z-index:1}

/* Dark Matter is handsome and nearly unreadable at a glance: the road network
   sits a few percent above black, which is fine on a desk and useless at a
   junction. Lifting the whole tile pane keeps the palette and makes the roads
   legible. The route is drawn in its own pane, so it isn't affected. */
@media (prefers-color-scheme: dark){
  .leaflet-tile-pane{filter:brightness(1.45) contrast(1.05) saturate(.88)}
}
.leaflet-container{font-family:Barlow,sans-serif;background:var(--bg)}
.leaflet-control-attribution{
  font-size:9px;background:var(--surface);color:var(--muted);
  border-radius:var(--pill) 0 0 0;padding:2px 8px;
}
.leaflet-control-attribution a{color:var(--muted)}

.start-dot,.lap-dot{
  width:16px;height:16px;border-radius:50%;
  border:3px solid var(--surface);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.start-dot{background:var(--accent)}
.lap-dot{width:20px;height:20px;background:var(--route)}

/* Place labels sitting over the map. Non-interactive, and outlined against
   the basemap so they stay readable over both roads and open country. */
/* A text halo was near-invisible here: the surface colour it was drawn in sits
   only a shade off the dark basemap. A solid chip is legible over roads, open
   country, the route line and the basemap's own labels alike. */
.place{
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  transform:translate(-6px,-11px);
}
.place.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 6px),-11px)}
.place i{
  width:8px;height:8px;border-radius:50%;flex:0 0 8px;
  background:var(--accent);border:2px solid var(--surface);box-sizing:content-box;
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.place span{
  font-family:"Barlow Condensed",Barlow,sans-serif;
  font-weight:600;font-size:15px;letter-spacing:.03em;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--pill);
  padding:2px 9px 3px;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}

/* ---------- panel ---------- */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:400;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  box-shadow:var(--shadow);
  padding:0 20px calc(16px + env(safe-area-inset-bottom));
  max-height:70vh;overflow-y:auto;
}

/* Views of equal standing, so the control shows all of them rather than
   hiding any behind a verb — saved laps used to be a collapsed disclosure
   buried at the bottom of Options, easy to forget existed. The track sits a
   step darker than the sheet so the selected segment reads as lifted out of it. */
#switch{
  display:flex;gap:2px;margin:10px 0 14px;padding:3px;
  background:var(--bg);border-radius:var(--pill);
}
#switch button{
  flex:1;border:0;border-radius:var(--pill);padding:7px 0;
  background:transparent;color:var(--muted);
  font-family:inherit;font-weight:600;font-size:14px;
  transition:background .18s ease,color .18s ease;
}
#switch button.on{background:var(--raised);color:var(--ink)}
#switch #saved-count{color:inherit;opacity:.7}

/* ---------- the numbers ---------- */
.readout{display:flex;align-items:baseline;gap:11px}
.dist{
  font-family:"Barlow Condensed",Barlow,sans-serif;
  font-weight:700;font-size:58px;line-height:.84;letter-spacing:-.015em;
}
.dist span{font-size:21px;font-weight:600;color:var(--muted);margin-left:4px}
.dur{
  font-family:"Barlow Condensed",Barlow,sans-serif;
  font-weight:500;font-size:26px;color:var(--muted);
}
/* This is the landing screen now, not a placeholder, so it reads as a
   statement of what's about to happen. */
.empty-line{color:var(--muted);font-size:16px;line-height:1.5;margin:6px 0 2px}
.approach{
  display:inline-block;margin-top:9px;padding:4px 11px;
  border-radius:var(--pill);background:color-mix(in srgb, var(--accent) 14%, transparent);
  color:var(--accent);font-size:13.5px;font-weight:600;
}
.approach:empty{display:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
/* [hidden] alone loses to the display:grid above — same origin, and a plain
   attribute selector doesn't outrank a class one, so the two need pairing. */
.stats[hidden]{display:none}
.stat{background:var(--raised);border-radius:var(--r);padding:11px 12px}
.stat b{
  display:block;font-family:"Barlow Condensed",Barlow,sans-serif;
  font-weight:700;font-size:25px;line-height:1.1;
}
.stat i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---------- recent searches ---------- */
/* This session's last few results, not saved ones — a way back to one you
   liked but hadn't starred yet, not a second list to manage. */
#history{display:flex;gap:7px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
#history:empty{display:none}
#history::-webkit-scrollbar{display:none}
.hist{
  flex:0 0 auto;padding:9px 15px;border:0;border-radius:var(--pill);
  background:var(--raised);color:var(--muted);white-space:nowrap;
  font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:15px;
}
.hist b{color:var(--ink);font-size:17px;margin-right:7px}
.hist.on{background:var(--ink);color:var(--surface)}
.hist.on b{color:var(--surface)}

/* ---------- actions ---------- */
.row{display:flex;gap:9px;margin-top:16px}
.row button{
  border:0;border-radius:var(--r);padding:16px 14px;
  font-size:16px;font-weight:600;background:var(--raised);
  transition:opacity .15s;
}
.row button[disabled]{opacity:.4}
#go{flex:2;background:var(--route);color:var(--on-route)}
#nav{flex:1}
#star{flex:0 0 56px;display:flex;align-items:center;justify-content:center;padding:0}
#star svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
#star[aria-pressed="true"]{background:color-mix(in srgb, var(--accent) 16%, transparent)}
#star[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}

/* Each tab gets only the actions that belong to it. Searching is something you
   do having set the options; Navigate and save are things you do to a lap you
   already have. Offering both at once made "Find a drive" read as though it
   might replace the lap you were looking at. */
/* The moods are the landing action now — no lap yet, so the question is what
   kind of drive, not "go". Once a lap exists the Route tab is about that lap;
   #go moves entirely into Options, for re-searching after changing your mind.
   #remood is the way back to the mood grid without losing the lap on screen —
   it stays visible the whole time you have a lap, unlike nav/star which step
   aside while the moods are showing. The Saved tab is a plain list — none of
   the action row belongs there. */
#sheet:not(.on-options) #go{display:none}
#sheet:not(.on-route) #nav,
#sheet:not(.on-route) #star,
#sheet.on-route:not(.has-route) #nav,
#sheet.on-route:not(.has-route) #star,
#sheet.on-route.remood #nav,
#sheet.on-route.remood #star{display:none}
#sheet.on-route:not(.has-route) #actions,
#sheet.on-saved #actions{display:none}

#remood{display:none;flex:1}
#sheet.on-route.has-route #remood{display:block}

#moods{display:none;flex-wrap:wrap}
#sheet.on-route:not(.has-route) #moods,
#sheet.on-route.has-route.remood #moods{display:flex}
#moods button{flex:1 1 calc(50% - 4.5px);background:var(--route);color:var(--on-route);
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  text-align:left;padding:12px 14px;transition:opacity .15s}
#moods button b{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:16px}
#moods button i{font-style:normal;font-weight:500;font-size:11.5px;line-height:1.3}
#moods.busy button{opacity:.45;pointer-events:none}

/* ---------- settings ---------- */
.field{margin-bottom:18px}
.field label{
  display:block;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px;
}
.chips{display:flex;align-items:center;gap:6px}
.chips button{
  flex:1;padding:13px 6px;border:0;border-radius:var(--pill);
  background:var(--raised);color:var(--muted);
  font-size:15px;font-weight:600;transition:background .15s,color .15s;
}
.chips button.on{background:var(--ink);color:var(--surface)}
.chips .unit{flex:0 0 auto;font-size:12.5px;color:var(--muted);padding-left:3px}

/* ---------- saved ---------- */
#saved-list{max-height:50vh;overflow-y:auto}
.lap{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.lap:last-child{border-bottom:0}
.lap-open{
  flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;
  font-family:Barlow,sans-serif;
}
.lap-name{
  display:block;font-family:"Barlow Condensed",Barlow,sans-serif;
  font-weight:600;font-size:18px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lap-sub{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.lap-acts{display:flex;gap:3px;flex:0 0 auto}
.lap-acts button{
  border:0;background:none;width:34px;height:34px;padding:0;
  font-size:15px;color:var(--muted);border-radius:var(--pill);
}
.lap-acts button.on{color:var(--accent)}
.lap-acts button:hover{background:var(--raised);color:var(--ink)}
#saved-empty{font-size:13.5px;color:var(--muted);margin:10px 0}

.via{
  margin:10px 0 0;font-size:14.5px;line-height:1.5;color:var(--muted);
}
.via b{color:var(--ink);font-weight:600}
.via:empty{display:none}

#msg{font-size:14px;margin-top:12px;color:var(--muted);min-height:20px}
#msg:empty{min-height:0;margin-top:0}
#msg.bad{color:var(--accent)}

/* Offline: the search button is the one thing that genuinely can't work,
   so it's the one thing that looks disabled. Everything else stays live. */
/* The nudge to time a driven lap, and the pace readout. */
.calib{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--raised);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px;margin:14px 0 0;
}
.calib span{flex:1 1 140px;font-size:14px;font-weight:600;color:var(--ink)}
.calib button{
  border:0;border-radius:var(--pill);padding:7px 14px;
  font-family:inherit;font-size:13px;font-weight:600;
  background:var(--route);color:var(--on-route);
}
.calib button.ghost{background:transparent;color:var(--muted)}
.hint{margin:8px 0 0;font-size:13.5px;color:var(--muted);line-height:1.45}

/* ---------- opening screen ---------- */
#splash{
  position:fixed;inset:0;z-index:2000;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .34s ease;
}
#splash.gone{opacity:0;pointer-events:none}
/* Failsafe: if the script never runs, this still clears the screen. */
#splash{animation:bail .3s linear 6s forwards}
@keyframes bail{to{opacity:0;visibility:hidden}}
#splash svg{width:104px;height:104px;overflow:visible}
#splash-b{
  fill:none;stroke:var(--route);stroke-width:10.5;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:250;stroke-dashoffset:250;
  animation:draw .95s cubic-bezier(.45,.05,.2,1) forwards;
}
#splash-dot{fill:var(--accent);opacity:0;animation:pop .3s ease .78s forwards}
#splash p{
  margin:0;font-family:"Barlow Condensed",Barlow,sans-serif;
  font-weight:600;font-size:22px;letter-spacing:.20em;text-transform:uppercase;
  color:var(--muted);opacity:0;animation:fade .45s ease .6s forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:1}}

/* Someone who's turned motion off gets the mark, not the performance. */
@media (prefers-reduced-motion:reduce){
  #splash-b{animation:none;stroke-dashoffset:0}
  #splash-dot,#splash p{animation:none;opacity:1}
}

/* An indeterminate stripe, because the wait genuinely has no known length. */
#go.busy{
  background:var(--raised);color:var(--muted);position:relative;overflow:hidden;
}
#go.busy::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb, var(--route) 30%, transparent),transparent);
  transform:translateX(-100%);
  animation:sweepbar 1.25s linear infinite;
}
@keyframes sweepbar{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){
  #go.busy::after{animation:none}
}

body.offline #go{opacity:.45}
body.offline #go::after{content:" · offline";font-weight:500;opacity:.8}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Painted before any script runs, so it covers the blank map rather than
     appearing after it. The B is one closed path, drawn stem-first. -->
<div id="splash">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path id="splash-b" d="M31 83 L31 17 A34 16.5 0 0 1 31 50 A40 16.5 0 0 1 31 83 Z"/>
    <circle id="splash-dot" cx="31" cy="83" r="4.8"/>
  </svg>
  <p>Backroads</p>
</div>

<div id="map"></div>

<div id="sheet" class="on-route">
  <div id="switch" role="tablist" aria-label="Panel view">
    <button id="tab-route" type="button" role="tab" aria-selected="true"
            aria-controls="pane-route" class="on">Route</button>
    <button id="tab-options" type="button" role="tab" aria-selected="false"
            aria-controls="pane-options">Options</button>
    <button id="tab-saved" type="button" role="tab" aria-selected="false"
            aria-controls="pane-saved">Saved <span id="saved-count"></span></button>
  </div>

  <div id="pane-route" role="tabpanel" aria-labelledby="tab-route">
    <div id="readout" hidden>
      <div class="readout">
        <div class="dist" id="km">—<span>mi</span></div>
        <div class="dur" id="dur"></div>
      </div>
      <div class="approach" id="approach"></div>
      <p class="via" id="via"></p>
      <p class="via" id="why"></p>
    </div>

    <p class="empty-line" id="empty">Find a lap you can drive round and round. Tap the map to start somewhere else.</p>
    <p class="via" id="weather"></p>

    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="s-run">—</b><i>miles best stretch</i></div>
      <div class="stat"><b id="s-twisty">—</b><i>of it cornering</i></div>
      <div class="stat"><b id="s-back">—</b><i>doubling back</i></div>
    </div>

    <div id="history"></div>
  </div>

  <div id="pane-options" role="tabpanel" aria-labelledby="tab-options" hidden>
    <div class="field">
      <label>How long you want to be out</label>
      <div class="chips" id="mins-chips">
        <button data-v="15">15m</button>
        <button data-v="30">30m</button>
        <button data-v="45">45m</button>
        <button data-v="60" class="on">1h</button>
      </div>
    </div>

    <div class="field">
      <label>Drive out to the start</label>
      <div class="chips" id="reach-chips">
        <button data-v="0">0</button>
        <button data-v="5">5</button>
        <button data-v="10" class="on">10</button>
        <span class="unit">miles</span>
      </div>
    </div>

    <div class="field">
      <label>Corner style</label>
      <div class="chips" id="style-chips">
        <button data-v="tight" class="on">Tight and technical</button>
        <button data-v="flowing">Fast and flowing</button>
      </div>
    </div>

  </div>

  <div id="pane-saved" role="tabpanel" aria-labelledby="tab-saved" hidden>
    <div id="saved-list"></div>
  </div>

  <div id="calib-slot"></div>

  <div class="row" id="moods">
    <button class="mood" data-mood="quick"><b>Quick drive</b><i>15 minutes, right from here</i></button>
    <button class="mood" data-mood="scenic"><b>Scenic drive</b><i>30 minutes, flowing roads over technical</i></button>
    <button class="mood" data-mood="fresh"><b>Fresh drive</b><i>45 minutes, avoids roads you know</i></button>
    <button class="mood" data-mood="long"><b>Long drive</b><i>An hour, repeats are fine</i></button>
  </div>

  <div class="row" id="actions">
    <button id="go">Find me a drive</button>
    <button id="remood" aria-pressed="false">Change mood</button>
    <button id="nav" disabled>Navigate</button>
    <button id="star" disabled aria-label="Save this lap" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg>
    </button>
  </div>

  <div id="msg"></div>
</div>

<script src="./vendor/leaflet.js"></script>
<script src="./app.js"></script>
</body>
</html>
